let userAnswersState = []; // Универсальный массив для сохранения ответов
let isShowingAnswerFeedback = false; // Флаг, показывающий, что мы замерли на экране с проверкой ответа

function startTest(testKey) {
    currentTestKey = testKey;
    currentIndex = 0;
    score = 0;
    isShowingAnswerFeedback = false;
    userAnswersState = new Array(testsData[testKey].length).fill(null);
    renderQuestion();
}

function renderQuestion() {
    const app = document.getElementById('app');
    const testArray = testsData[currentTestKey];
    
    if (currentIndex >= testArray.length) {
        renderResults();
        return;
    }

    const item = testArray[currentIndex];
    const savedAnswer = userAnswersState[currentIndex];

    let questionContent = '';
    if (item.img) {
        questionContent = `<img src="${item.img}" alt="Вопрос с иллюстрацией" class="question-image">`;
    } else if (item.q) {
        questionContent = `<p><strong>${item.q}</strong></p>`;
    }

    let html = `
        <h2>Вопрос ${currentIndex + 1} из ${testArray.length}</h2>
        <div class="question-box">
            ${questionContent}
    `;

    if (item.a && Array.isArray(item.a)) {
        const isMultiple = Array.isArray(item.correct) && item.correct.length > 1;
        const inputType = isMultiple ? 'checkbox' : 'radio';
        
        html += `<ul class="options">`;
        item.a.forEach((opt, idx) => {
            let checked = '';
            let styleOption = '';

            if (isMultiple) {
                if (Array.isArray(savedAnswer) && savedAnswer.includes(idx)) {
                    checked = 'checked';
                }
            } else {
                if (savedAnswer === idx) {
                    checked = 'checked';
                }
            }

            // Если включен режим показа правильного ответа (после нажатия "Далее")
            if (isShowingAnswerFeedback) {
                const correctArr = Array.isArray(item.correct) ? item.correct : [item.correct];
                const userArr = Array.isArray(savedAnswer) ? savedAnswer : [savedAnswer];

                if (correctArr.includes(idx)) {
                    // Зеленый цвет для правильных вариантов
                    styleOption = 'background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb;';
                } else if (userArr.includes(idx)) {
                    // Красный цвет для того, что выбрал пользователь, но оно неверное
                    styleOption = 'background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;';
                }
            }

            html += `
                <li>
                    <label style="display: block; padding: 8px 12px; border-radius: 6px; ${styleOption}">
                        <input type="${inputType}" name="question" value="${idx}" ${checked} ${isShowingAnswerFeedback ? 'disabled' : ''} onclick="selectOption(${idx}, ${isMultiple})"> 
                        ${opt}
                    </label>
                </li>
            `;
        });
        html += `</ul>`;
    } else {
        const textVal = savedAnswer !== null ? savedAnswer : '';
        let textStyle = '';
        if (isShowingAnswerFeedback) {
            const cleanUser = String(savedAnswer).trim().toLowerCase();
            const cleanCorrect = String(item.answerText).trim().toLowerCase();
            if (cleanUser === cleanCorrect) {
                textStyle = 'background-color: #d4edda; border: 1px solid #c3e6cb;';
            } else {
                textStyle = 'background-color: #f8d7da; border: 1px solid #f5c6cb;';
            }
        }

        html += `
            <div style="margin-top: 15px;">
                <input type="text" id="userAnswerInput" value="${textVal}" placeholder="Введите ваш ответ..." ${isShowingAnswerFeedback ? 'disabled' : ''} style="width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; ${textStyle}" oninput="saveInputAnswer(this.value)">
            </div>
        `;
    }

    // Блок для вывода статуса ответа (Правильно / Неправильно) прямо под вопросом
    if (isShowingAnswerFeedback) {
        let isCurrentCorrect = false;
        if (item.a) {
            const correctArr = Array.isArray(item.correct) ? item.correct : [item.correct];
            const userArr = Array.isArray(savedAnswer) ? savedAnswer : [savedAnswer];
            const userSorted = [...userArr].sort();
            const correctSorted = [...correctArr].sort();
            if (JSON.stringify(userSorted) === JSON.stringify(correctSorted)) {
                isCurrentCorrect = true;
            }
        } else if (item.answerText) {
            if (String(savedAnswer).trim().toLowerCase() === String(item.answerText).trim().toLowerCase()) {
                isCurrentCorrect = true;
            }
        }

        const alertStyle = isCurrentCorrect ? 'background-color: #d4edda; color: #155724;' : 'background-color: #f8d7da; color: #721c24;';
        const alertText = isCurrentCorrect ? '✅ Верно!' : '❌ Неверно! Правильные ответы отмечены зеленым.';
        
        html += `<div style="margin-top: 15px; padding: 10px; border-radius: 6px; font-weight: bold; ${alertStyle}">${alertText}</div>`;
    }

    html += `
            <button class="nav-btn" style="background-color: #f39c12; margin-top: 15px;" onclick="toggleHint()">Показать подсказку</button>
            <div id="hintBox" class="hint" style="display:none; margin-top:10px;">${item.hint}</div>
        </div>
        <div class="nav-buttons">
            <button class="nav-btn" ${currentIndex === 0 || isShowingAnswerFeedback ? 'style="visibility:hidden"' : ''} onclick="prevQuestion()">Назад</button>
            <button class="nav-btn" onclick="nextQuestion()">${isShowingAnswerFeedback ? 'Далее' : 'Ответить'}</button>
        </div>
    `;

    app.innerHTML = html;
}

function selectOption(idx, isMultiple) {
    if (isShowingAnswerFeedback) return; // Запрещаем менять выбор, когда идет показ правильного ответа
    if (isMultiple) {
        if (!Array.isArray(userAnswersState[currentIndex])) {
            userAnswersState[currentIndex] = [];
        }
        const currentSelected = userAnswersState[currentIndex];
        const position = currentSelected.indexOf(idx);
        
        if (position > -1) {
            currentSelected.splice(position, 1);
        } else {
            currentSelected.push(idx);
        }
    } else {
        userAnswersState[currentIndex] = idx;
    }
}

function saveInputAnswer(val) {
    if (!isShowingAnswerFeedback) {
        userAnswersState[currentIndex] = val;
    }
}

function toggleHint() {
    const hintBox = document.getElementById('hintBox');
    hintBox.style.display = hintBox.style.display === 'block' ? 'none' : 'block';
}

function nextQuestion() {
    const item = testsData[currentTestKey][currentIndex];
    
    // Если это текстовое поле, подстрахуемся
    const inputField = document.getElementById('userAnswerInput');
    if (inputField && !isShowingAnswerFeedback) {
        userAnswersState[currentIndex] = inputField.value;
    }

    const currentAns = userAnswersState[currentIndex];
    const isEmptyArray = Array.isArray(currentAns) && currentAns.length === 0;
    
    if (currentAns === null || currentAns === '' || isEmptyArray) {
        alert('Пожалуйста, ответьте на вопрос!');
        return;
    }

    // Если мы еще НЕ показывали фидбек — показываем его (подсвечиваем ошибки/правильные ответы)
    if (!isShowingAnswerFeedback) {
        isShowingAnswerFeedback = true;
        
        // Засчитываем балл сразу (если нужно для итогового экрана)
        if (item.a) {
            const correctAns = item.correct;
            if (Array.isArray(correctAns)) {
                if (Array.isArray(currentAns)) {
                    const userSorted = [...currentAns].sort();
                    const correctSorted = [...correctAns].sort();
                    if (JSON.stringify(userSorted) === JSON.stringify(correctSorted)) {
                        // Помечаем в уме, что отвечено верно (баллы можно собрать в конце)
                    }
                }
            } else {
                if (currentAns === correctAns) {
                    // Верно
                }
            }
        }
        
        renderQuestion(); // Перерисовываем экран с подсветкой цветом и сменой кнопки на "Далее"
        return;
    }

    // Если фидбек уже был показан, то при повторном клике переходим к следующему вопросу
    isShowingAnswerFeedback = false;
    currentIndex++;
    renderQuestion();
}

function prevQuestion() {
    if (currentIndex > 0 && !isShowingAnswerFeedback) {
        currentIndex--;
        renderQuestion();
    }
}

function renderResults() {
    const testArray = testsData[currentTestKey];
    score = 0;

    // Подсчет итоговых баллов
    userAnswersState.forEach((userAns, idx) => {
        const item = testArray[idx];
        if (item.a) {
            const correctAns = item.correct;
            if (Array.isArray(correctAns)) {
                if (Array.isArray(userAns)) {
                    const userSorted = [...userAns].sort();
                    const correctSorted = [...correctAns].sort();
                    if (JSON.stringify(userSorted) === JSON.stringify(correctSorted)) {
                        score++;
                    }
                }
            } else {
                if (userAns === correctAns) {
                    score++;
                }
            }
        } else if (item.answerText) {
            const cleanUser = String(userAns).trim().toLowerCase();
            const cleanCorrect = String(item.answerText).trim().toLowerCase();
            if (cleanUser === cleanCorrect) {
                score++;
            }
        }
    });

    const percent = Math.round((score / testArray.length) * 100);
    const message = percent >= 80 ? 'Отличный результат!' : 'Есть над чем поработать.';

    const app = document.getElementById('app');
    app.innerHTML = `
        <h2>Результаты тестирования</h2>
        <div class="result-box">
            <p>Правильных ответов: ${score} из ${testArray.length} (${percent}%)</p>
            <p style="color: #2980b9; font-size: 16px; margin-top: 15px;">${message}</p>
        </div>
        <div style="text-align: center; margin-top: 30px;">
            <button class="btn" onclick="location.reload()" style="display: inline-block; width: auto; padding: 12px 30px;">Вернуться в главное меню</button>
        </div>
    `;
}
