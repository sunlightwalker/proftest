let userAnswersState = []; // Универсальный массив для сохранения ответов (и индексов, и текста)

function startTest(testKey) {
    currentTestKey = testKey;
    currentIndex = 0;
    score = 0;
    userAnswersState = new Array(testsData[testKey].length).fill(null);
    renderQuestion();
}

function renderQuestion() {
    const app = document.getElementById('app');
    const testArray = testsData[currentTestKey];
    
    if (currentIndex >= testArray.length) {
        renderResults();
        return;
    }

    const item = testArray[currentIndex];
    const savedAnswer = userAnswersState[currentIndex];

    // Определяем, выводить текст вопроса или картинку
    let questionContent = '';
    if (item.img) {
        questionContent = `<img src="${item.img}" alt="Вопрос с иллюстрацией" class="question-image">`;
    } else if (item.q) {
        questionContent = `<p><strong>${item.q}</strong></p>`;
    }

    let html = `
        <h2>Вопрос ${currentIndex + 1} из ${testArray.length}</h2>
        <div class="question-box">
            ${questionContent}
    `;

    // Проверяем: если есть массив вариантов 'a', выводим радиокнопки. Иначе — поле ввода.
    if (item.a && Array.isArray(item.a)) {
        html += `<ul class="options">`;
        item.a.forEach((opt, idx) => {
            const checked = savedAnswer === idx ? 'checked' : '';
            html += `
                <li>
                    <label>
                        <input type="radio" name="question" value="${idx}" ${checked} onclick="selectOption(${idx})"> 
                        ${opt}
                    </label>
                </li>
            `;
        });
        html += `</ul>`;
    } else {
        const textVal = savedAnswer !== null ? savedAnswer : '';
        html += `
            <div style="margin-top: 15px;">
                <input type="text" id="userAnswerInput" value="${textVal}" placeholder="Введите ваш ответ..." style="width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;" oninput="saveInputAnswer(this.value)">
            </div>
        `;
    }

    html += `
            <button class="nav-btn" style="background-color: #f39c12; margin-top: 15px;" onclick="toggleHint()">Показать подсказку</button>
            <div id="hintBox" class="hint">${item.hint}</div>
        </div>
        <div class="nav-buttons">
            <button class="nav-btn" ${currentIndex === 0 ? 'style="visibility:hidden"' : ''} onclick="prevQuestion()">Назад</button>
            <button class="nav-btn" onclick="nextQuestion()">${currentIndex === testArray.length - 1 ? 'Завершить тест' : 'Далее'}</button>
        </div>
    `;

    app.innerHTML = html;
}

function selectOption(idx) {
    userAnswersState[currentIndex] = idx;
}

function saveInputAnswer(val) {
    userAnswersState[currentIndex] = val;
}

function toggleHint() {
    const hintBox = document.getElementById('hintBox');
    hintBox.style.display = hintBox.style.display === 'block' ? 'none' : 'block';
}

function nextQuestion() {
    // Если это текстовое поле, подстрахуемся и сохраним значение при клике "Далее"
    const inputField = document.getElementById('userAnswerInput');
    if (inputField) {
        userAnswersState[currentIndex] = inputField.value;
    }

    if (userAnswersState[currentIndex] === null || userAnswersState[currentIndex] === '') {
        alert('Пожалуйста, ответьте на вопрос!');
        return;
    }

    currentIndex++;
    renderQuestion();
}

function prevQuestion() {
    if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
    }
}

function renderResults() {
    const testArray = testsData[currentTestKey];
    score = 0;

    userAnswersState.forEach((userAns, idx) => {
        const item = testArray[idx];
        
        if (item.a) {
            // Проверка для вопросов с выбором вариантов
            if (userAns === item.correct) {
                score++;
            }
        } else if (item.answerText) {
            // Проверка для вопросов с ручным вводом (с очисткой пробелов и регистра)
            const cleanUser = String(userAns).trim().toLowerCase();
            const cleanCorrect = String(item.answerText).trim().toLowerCase();
            if (cleanUser === cleanCorrect) {
                score++;
            }
        }
    });

    const percent = Math.round((score / testArray.length) * 100);
    const message = percent >= 80 ? 'Отличный результат!' : 'Есть над чем поработать.';

    const app = document.getElementById('app');
    app.innerHTML = `
        <h2>Результаты тестирования</h2>
        <div class="result-box">
            <p>Правильных ответов: ${score} из ${testArray.length} (${percent}%)</p>
            <p style="color: #2980b9; font-size: 16px; margin-top: 15px;">${message}</p>
        </div>
        <div style="text-align: center; margin-top: 30px;">
            <button class="btn" onclick="location.reload()" style="display: inline-block; width: auto; padding: 12px 30px;">Вернуться в главное меню</button>
        </div>
    `;
}
</script>

</body>
</html>
